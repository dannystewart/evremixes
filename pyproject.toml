[project]
name = "evremixes"
version = "1.0.16.dev0"
description = "Evanescence Remix Downloader"
authors = [{ name = "Danny Stewart", email = "danny@stewart.cc" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "halo (>=0.0.31)",
    "inquirer (>=3.4.1,<4.0.0)",
    "mutagen (>=1.48.1,<2.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "polykit (>=0.15.0)",
    "requests (>=2.34.2,<3.0.0)",
    "types-requests (>=2.33.0.20261006,<3.0.0.0)",
    "urllib3 (>=2.8.0,<3.0.0)",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Internet",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

[project.urls]
Homepage = "https://music.dannystewart.com/evanescence/"
Repository = "https://github.com/dannystewart/evremixes/"

[tool.poetry.group.dev.dependencies]
mypy = ">=2.4.0"
pre-commit = ">=4.7.0"
ruff = ">=0.17.1"
polykit = { path = "../polykit", develop = true }

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
evremixes = "evremixes.main:main"
